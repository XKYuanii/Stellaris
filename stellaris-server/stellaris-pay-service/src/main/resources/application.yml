#服务端口
server:
  port: 6087
# 应用名称
spring:
  profiles:
    active: local
  application:
    name: ${prefix.distinction.name:stellaris}-pay-service
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
    jackson:
      time-zone: GMT+8
      date-format: yyyy-MM-dd HH:mm:ss
      generator:
        WRITE_NUMBERS_AS_STRINGS: true
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-pay-${spring.profiles.active}.yaml
  data:
    redis:
      database: 0
      host: ${STELLARIS_REDIS_HOST:127.0.0.1}
      port: ${STELLARIS_REDIS_PORT:6380}
      password: redis123
      timeout: 3000
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地多服务部署固定走回环地址，跨主机部署时用环境变量覆盖。
        ip: ${STELLARIS_NACOS_DISCOVERY_IP:127.0.0.1}
        username: nacos
        password: nacos
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
feign:
  sentinel:
    enabled: false
  hystrix:
    enabled: true
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 512
    response:
      enabled: true
management:
  metrics:
    tags:
      application: pay-service
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
jasypt:
  encryptor:
    password: bgtjkjl!%^sdc
    algorithm: PBEWithMD5AndDES
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      #生成文档所需的扫包路径，一般为启动类目录
      packages-to-scan: com.stellaris.controller
#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
refund-intent-retry:
  enabled: true
  fixed-delay-ms: 60000
  processing-timeout-ms: 60000
  batch-size: 50
  max-attempts: 10
  backoff-ms: 60000

payment-channel-reconciliation:
  # 最多并发 10 个渠道查单；20 条批次最坏分两波完成，避免串行查询超过 Order 的超时。
  max-queries-per-batch: 20
  executor:
    core-size: 10
    max-size: 10
    queue-capacity: 100

alipay:
  appId: 9021000134628973
  sellerId: 2088721028872203
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  connectTimeout: 2000
  readTimeout: 5000
  merchantPrivateKey: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipayPublicKey: 
  contentKey: ${ALIPAY_CONTENT_KEY:}
