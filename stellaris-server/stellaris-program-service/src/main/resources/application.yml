#服务端口
server:
  port: 6086
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 同步 Redis 热路径在本机压测中的并发拐点约为 100；多余工作线程只会放大下游排队。
  tomcat:
    threads:
      max: 100                    # 到达并发上限后由 accept 队列背压
      min-spare: 100              # 尖峰到达前预建工作线程
    max-connections: 12000        # 最大连接数(大幅提升)
    accept-count: 500             # 等待队列长度(增加至500)
    connection-timeout: 20000     # 连接超时时间(缩短至20秒)
    max-http-header-size: 8192    # HTTP头最大大小
    # 额外的高并发优化配置
    max-swallow-size: -1          # 禁用请求体大小限制
    max-http-form-post-size: -1   # 禁用POST表单大小限制
# 应用名称
spring:
  profiles:
    active: local
  application:
    name: ${prefix.distinction.name:stellaris}-program-service
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  # 高并发优化配置
  task:
    execution:
      pool:
        core-size: 50               # 异步任务核心线程数
        max-size: 200               # 异步任务最大线程数
        queue-capacity: 1000        # 异步任务队列容量
        keep-alive: 60s             # 线程空闲时间
    scheduling:
      pool:
        size: 20                    # 定时任务线程池大小
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
    jackson:
      time-zone: GMT+8
      date-format: yyyy-MM-dd HH:mm:ss
      generator:
        WRITE_NUMBERS_AS_STRINGS: true
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-program-${spring.profiles.active}.yaml
  data:  
    redis:
      database: 0
      host: ${STELLARIS_REDIS_HOST:127.0.0.1}
      port: ${STELLARIS_REDIS_PORT:6380}
      password: redis123
      timeout: 5000                     # 连接超时时间(5秒)
      lettuce:
        pool:
          max-active: 500               # 最大活跃连接数
          max-idle: 100                 # 最大空闲连接数
          min-idle: 20                  # 最小空闲连接数
          max-wait: 3000                # 最大等待时间(3秒)
      stream:
        streamName: invalid_program
        consumerType: broadcast
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
      circuitbreaker:
        enabled: false
      okhttp:
        enabled: true
      compression:
        request:
          enabled: true
          mime-types: text/xml,application/xml,application/json
          min-request-size: 512
        response:
          enabled: true
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地多服务部署固定走回环地址，跨主机部署时用环境变量覆盖。
        ip: ${STELLARIS_NACOS_DISCOVERY_IP:127.0.0.1}
        username: nacos
        password: nacos
      eager: true
bloom-filter:
  name: program-detail-bloom-filter
  expectedInsertions: 1000
  falseProbability: 0.01
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    local-cache-scope: statement
management:
  metrics:
    tags:
      application: program-service
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
jasypt:
  encryptor:
    password: bgtjkjl!%^sdc
    algorithm: PBEWithMD5AndDES
stellaris:
  management:
    operations:
      enabled: false
elasticsearch:
  # The bundled interview Compose publishes Elasticsearch on host port 9201.
  # External deployments can still override this with STELLARIS_ELASTICSEARCH_URL.
  ip: ${STELLARIS_ELASTICSEARCH_URL:127.0.0.1:9201}
  userName: elastic
  passWord: elastic123
  maxConnectNum: 400                    # HTTP连接池上限，不等于线程数
  ioThreadCount: 4                      # Elasticsearch I/O selector线程
program:
  cache-audit:
    # Cache Aside 的删缓存不在事务里，删除失败会让旧值脏到 TTL 过期且无人发现。
    # 这是低频兜底对账，不是实时一致性手段，调高频率只会白白打库。
    enabled: ${STELLARIS_PROGRAM_CACHE_AUDIT_ENABLED:true}
    fixed-delay-ms: ${STELLARIS_PROGRAM_CACHE_AUDIT_DELAY_MS:300000}
    sample-size: ${STELLARIS_PROGRAM_CACHE_AUDIT_SAMPLE:50}
reference-order:
  reservation-timeout-ms: 900000
  expiry-cleanup-grace-ms: 60000
  idempotency-receipt-ttl-ms: 86400000
  # 同一销售分片未确认事件达到阈值时，在 Lua 写库存前拒绝新请求。
  max-stream-length: ${STELLARIS_ORDER_STREAM_MAX_LENGTH:100000}
  # 自动配座从 requestId Hash 对应位置读取有界候选，并仅对座位竞争最多尝试 5 次。
  candidate-limit: 2000
  auto-seat-max-attempts: 5
  # 冷缓存只负责投递后台重建并快速失败，绝不占用下单线程全量扫库。
  preheat-executor:
    core-size: ${STELLARIS_PREHEAT_CORE_SIZE:1}
    max-size: ${STELLARIS_PREHEAT_MAX_SIZE:4}
    queue-capacity: ${STELLARIS_PREHEAT_QUEUE_CAPACITY:100}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      #生成文档所需的扫包路径，一般为启动类目录
      packages-to-scan: com.stellaris.controller
#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
