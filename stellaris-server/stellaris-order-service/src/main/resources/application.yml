#服务端口
server:
  port: 8081
  # Tomcat线程池配置优化(订单服务高负载)
  tomcat:
    threads:
      max: 500                    # 最大工作线程数(订单服务负载更高)
      min-spare: 80               # 最小空闲线程数
    max-connections: 10000        # 最大连接数
    accept-count: 300             # 等待队列长度
    connection-timeout: 30000     # 连接超时时间(30秒)
    max-http-header-size: 8192    # HTTP头最大大小
# 应用名称
spring:
  profiles:
    active: local
  application:
    name: ${prefix.distinction.name:stellaris}-order-service
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
    jackson:
      time-zone: GMT+8
      date-format: yyyy-MM-dd HH:mm:ss
      generator:
        WRITE_NUMBERS_AS_STRINGS: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${STELLARIS_TRADE_DB_URL:jdbc:mysql://127.0.0.1:3306/stellaris_trade?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai&autoReconnect=true}
    username: ${STELLARIS_TRADE_DB_USERNAME:root}
    password: ${STELLARIS_TRADE_DB_PASSWORD:mysql123}
    hikari:
      minimum-idle: 15
      maximum-pool-size: 80
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  data:
    redis:
      database: 0
      host: ${STELLARIS_REDIS_HOST:127.0.0.1}
      port: ${STELLARIS_REDIS_PORT:6380}
      password: redis123
      timeout: 5000                     # 连接超时时间(5秒)
      lettuce:
        pool:
          max-active: 600               # 最大活跃连接数(订单服务负载高)
          max-idle: 120                 # 最大空闲连接数
          min-idle: 30                  # 最小空闲连接数
          max-wait: 3000                # 最大等待时间(3秒)
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 3000
          # 支付事实批查可能包含两波并行渠道查单，单独放宽而不拖长其他内部调用。
          stellaris-pay-service:
            connect-timeout: 1000
            read-timeout: 20000
      okhttp:
        enabled: true
      compression:
        request:
          enabled: true
          mime-types: text/xml,application/xml,application/json
          min-request-size: 512
        response:
          enabled: true
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地多服务部署固定走回环地址，避免可靠事件重试命中不可达的旧网卡 IP。
        ip: ${STELLARIS_NACOS_DISCOVERY_IP:127.0.0.1}
        username: nacos
        password: nacos
  task:
    scheduling:
      # 五个业务恢复任务各保留一个调度槽；Stream 指标另用专用调度器。
      pool:
        size: 5
      thread-name-prefix: order-scheduling-
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    local-cache-scope: statement
management:
  metrics:
    tags:
      application: order-service
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
jasypt:
  encryptor:
    password: bgtjkjl!%^sdc
    algorithm: PBEWithMD5AndDES
stellaris:
  management:
    operations:
      enabled: false
# Redis Lua 同事务写入的建单事件由订单服务直接消费。
order-stream:
  enabled: true
  group: stellaris-order-service
  # 与 Program 准入 Lua 共用同一环境变量，避免监控阈值和实际拒绝阈值漂移。
  max-stream-length: ${STELLARIS_ORDER_STREAM_MAX_LENGTH:100000}
  batch-size: 32
  block-ms: 1000
  claim-idle-ms: 60000
  recovery-fixed-delay-ms: 10000
  # 独立调度，数据库故障拖慢 PEL 重领时仍持续刷新容量与消息年龄。
  observation-fixed-delay-ms: 10000
  error-backoff-ms: 1000
  shutdown-timeout-ms: 10000

# v5 支付/取消后的 Redis 状态同步命令：订单状态与事件同事务提交，同步失败后异步重试。
reservation-transition:
  fixed-delay-ms: 5000
  retry-backoff-ms: 5000
  processing-timeout-ms: 60000
  # 0 表示不自动进入 DEAD；订单终态同步必须持续收敛，人工停重试需显式操作。
  max-attempts: 0
  batch-size: 100
  executor:
    core-size: 4
    max-size: 16
    queue-capacity: 1000

payment-reconciliation:
  fixed-delay-ms: 10000
  retry-backoff-ms: 10000
  processing-timeout-ms: 60000
  # 每轮最多 claim 100 条，再按 20 条拆分远程请求。这样不突破 Pay 的单批渠道查单上限，
  # 同时把 2000 条 WAITING 事件的理论全量扫描周期从约 17 分钟降到约 3 分钟。
  batch-size: 100
  remote-batch-size: 20

reservation-expiration:
  fixed-delay-ms: 10000
  # 留出 Stream 消费和数据库事务的正常在途时间，避免把刚过期的在途消息误判为孤儿。
  grace-ms: 60000
  # 单条恢复失败时更新 ZSET 分数，避免永久失败项占满每一页的队头。
  retry-backoff-ms: 30000
  batch-size: 100

order:
  expiry:
    fixed-delay-ms: 5000
    batch-size: 100
    max-batches-per-run: 20
    # 失败订单持久化延期，避免永久失败的 100 条记录阻塞后续关单。
    retry-backoff-ms: 60000
    # 多实例按订单主键取模分区。部署 N 个实例时分别配置 index=0..N-1；单实例保持默认值。
    partition-count: ${STELLARIS_ORDER_EXPIRY_PARTITION_COUNT:1}
    partition-index: ${STELLARIS_ORDER_EXPIRY_PARTITION_INDEX:0}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      #生成文档所需的扫包路径，一般为启动类目录
      packages-to-scan: com.stellaris.controller
#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
