#服务端口
server:
  port: 6085

  http2:
    enabled: false
# 应用名称
spring:
  application:
    name: ${prefix.distinction.name:stellaris}-gateway-service
  profiles:
    # 微服务调用
    active: pro
    # 单体服务调用
#    active: single
  main:
    allow-bean-definition-overriding: true
  data:
    redis:
      database: 0
      host: ${STELLARIS_REDIS_HOST:127.0.0.1}
      port: ${STELLARIS_REDIS_PORT:6380}
      password: redis123
      timeout: 5000                     # 连接超时时间(5秒)
      jedis:
        pool:
          max-active: 300               # 最大活跃连接数
          max-idle: 60                  # 最大空闲连接数
          min-idle: 10                  # 最小空闲连接数
          max-wait: 3000                # 最大等待时间(3秒)
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地多服务部署固定走回环地址，跨主机部署时用环境变量覆盖。
        ip: ${STELLARIS_NACOS_DISCOVERY_IP:127.0.0.1}
        username: nacos
        password: nacos
        metadata:
          # true表示灰度服务/false表示生产服务(默认)
          gray: false
    sentinel:
      eager: true
      transport:
        port: 8768
        dashboard: 127.0.0.1:8082
#      datasource:
#        degrade:
#          nacos:
#            server-addr: ${spring.cloud.nacos.discovery.server-addr}
#            dataId: ${spring.application.name}-degrade-rules
#            groupId: SENTINEL_GROUP
#            dataType: json
#            rule-type: degrade
#        flow:
#          nacos:
#            server-addr: ${spring.cloud.nacos.discovery.server-addr}
#            dataId: ${spring.application.name}-flow-rules
#            groupId: SENTINEL_GROUP
#            dataType: json
#            rule-type: flow
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
  kafka:
    bootstrap-servers: ${STELLARIS_KAFKA_SERVERS:127.0.0.1:9092}
    producer:
      retries: 1
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    topic: save_api_data
api:
  limit:
    paths: /**/customize/test/test   
# Signed/encrypted access is the default. Set this only for an isolated local demo.
allow:
  normal:
    access: ${STELLARIS_ALLOW_NORMAL_ACCESS:false}
gateway:
  bulkhead:
    # 本机下游并发隔离；不是 QPS 限流。生产值应由压测和下游连接池容量确定。
    enabled: true
    max-concurrent-requests: 200
  rate-limit:
    # Redis Lua 令牌桶。生产启用前必须依据压测数据调整规则。
    enabled: true
    rules:
      - id: query-ip
        path: /stellaris/program/program/detail/**
        dimension: IP
        capacity: 60
        refill-tokens: 60
        refill-period-millis: 1000
        fail-policy: LOCAL
      - id: order-user
        path: /stellaris/program/program/order/create/v5
        dimension: USER
        capacity: 3
        refill-tokens: 3
        refill-period-millis: 1000
        fail-policy: CLOSED
      - id: order-program
        path: /stellaris/program/program/order/create/v5
        dimension: PROGRAM
        capacity: ${STELLARIS_ORDER_PROGRAM_BURST:1000}
        refill-tokens: ${STELLARIS_ORDER_PROGRAM_QPS:1000}
        refill-period-millis: 1000
        fail-policy: CLOSED
      - id: order-global
        path: /stellaris/program/program/order/create/v5
        dimension: GLOBAL
        capacity: ${STELLARIS_ORDER_GLOBAL_BURST:3000}
        refill-tokens: ${STELLARIS_ORDER_GLOBAL_QPS:3000}
        refill-period-millis: 1000
        fail-policy: CLOSED
      - id: payment-user
        path: /stellaris/order/order/pay
        dimension: USER
        capacity: 1
        refill-tokens: 1
        refill-period-millis: 1000
        fail-policy: CLOSED
      - id: payment-check-user
        path: /stellaris/order/order/pay/check
        dimension: USER
        capacity: 1
        refill-tokens: 1
        refill-period-millis: 1000
        fail-policy: CLOSED
feign:
  sentinel:
    enabled: false
  hystrix:
    enabled: true
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 512
    response:
      enabled: true
management:
  metrics:
    tags:
      application: gateway-service
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
jasypt:
  encryptor:
    password: bgtjkjl!%^sdc
    algorithm: PBEWithMD5AndDES
# knife4j 网关聚合
knife4j:
  gateway:
    enabled: true
    # 指定服务发现的模式聚合微服务文档，并且是默认 default 分组
    strategy: discover
    discover:
      # OpenAPI 3.0 规范 
      version: openapi3
      enabled: true
