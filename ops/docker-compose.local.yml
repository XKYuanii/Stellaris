name: stellaris-local

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql123
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - stellaris_mysql_data:/var/lib/mysql
      - ../sql/cloud:/docker-entrypoint-initdb.d/cloud:ro
      - ../sql/cloud/1_stellaris_cloud_create_database.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
      - ../sql/cloud/stellaris_base_data.sql:/docker-entrypoint-initdb.d/10-base-data.sql:ro
      - ../sql/cloud/stellaris_customize.sql:/docker-entrypoint-initdb.d/20-customize.sql:ro
      - ../sql/cloud/stellaris_pay_0.sql:/docker-entrypoint-initdb.d/40-pay-0.sql:ro
      - ../sql/cloud/stellaris_pay_1.sql:/docker-entrypoint-initdb.d/41-pay-1.sql:ro
      - ../sql/cloud/stellaris_program_0.sql:/docker-entrypoint-initdb.d/50-program-0.sql:ro
      - ../sql/cloud/stellaris_program_1.sql:/docker-entrypoint-initdb.d/51-program-1.sql:ro
      - ../sql/cloud/stellaris_user_0.sql:/docker-entrypoint-initdb.d/60-user-0.sql:ro
      - ../sql/cloud/stellaris_user_1.sql:/docker-entrypoint-initdb.d/61-user-1.sql:ro
      - ../sql/reliability/20260910_single_trade_stream_schema.sql:/docker-entrypoint-initdb.d/90-single-trade-stream.sql:ro
      - ../sql/reliability/20260825_refund_intent.sql:/docker-entrypoint-initdb.d/92-refund-intent.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 40

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redis123"]
    ports:
      - "6380:6379"
    volumes:
      - stellaris_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.3.2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: U2VjdXJlWGl1Z1lhbkludGVydmlld1Rva2VuMjAyNjA4MjU=
      NACOS_AUTH_IDENTITY_KEY: stellaris
      NACOS_AUTH_IDENTITY_VALUE: interview
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: elastic123
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9201:9200"
    volumes:
      - stellaris_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:elastic123 http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40

volumes:
  stellaris_mysql_data:
  stellaris_redis_data:
  stellaris_elasticsearch_data:
